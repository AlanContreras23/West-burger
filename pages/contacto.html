    <link rel="stylesheet" href="../css/main.css">
    <title>West Burger | Contacto</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html"><img src="../imagens/Logo.png" alt="Logo de West Burger"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menú de navegación"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="contenido-pagina">
        <h1>Contacto</h1>
        <p>Dejanos tu consulta y nos comunicaremos con vos.</p>

        <form class="formulario-contacto" action="#" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" required></textarea>

            <button type="submit">Enviar consulta</button>
        </form>
    </main>

    <footer><p>© 2026 West Burger. Todos los derechos reservados.</p></footer>
